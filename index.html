<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고려딜리버리 기사 위치 공유</title><link rel="stylesheet" href="style.css"></head><body><main><div class="card"><div class="brand"><div class="logo">K</div><div><h1>고려딜리버리</h1><small>기사 전용 GPS 위치 공유</small></div></div>
<section id="login"><label for="id">기사 아이디</label><input id="id" autocomplete="username" placeholder="발급받은 아이디"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" placeholder="발급받은 비밀번호"><button id="signIn">로그인</button><p class="muted">관리자가 발급한 계정만 로그인할 수 있습니다.</p></section>
<section id="tracking" class="hidden"><h2 id="hello">기사님</h2><div class="status"><b id="state">위치 공유 중지</b><div id="last">위치 전송 전</div></div><div class="grid"><div><small>전송 주기</small><b>5초</b></div><div><small>GPS 정확도</small><b id="accuracy">—</b></div></div><button id="start">위치 공유 시작</button><button id="stop" class="stop hidden">위치 공유 종료</button><button id="signOut" class="secondary">로그아웃</button><p class="muted">위치 공유를 시작한 동안만 전송합니다. 화면 잠금·브라우저 종료·백그라운드 상태에서는 전송이 중단될 수 있습니다.</p></section><p id="msg" role="status" aria-live="polite"></p></div></main><script src="config.js"></script><script type="module" src="rider.js"></script></body></html>
