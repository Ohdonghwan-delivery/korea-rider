<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고려딜리버리 기사 계정 발급</title><link rel="stylesheet" href="style.css"></head><body><main style="max-width:680px"><div class="card"><div class="brand"><div class="logo">K</div><div><h1>기사 계정 발급</h1><small>관리자 전용</small></div></div><section id="adminLogin"><label>관리자 이메일</label><input id="email" type="email" autocomplete="username"><label>관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password"><button id="login">관리자 로그인</button></section><section id="adminPanel" class="hidden"><h2>새 기사 계정</h2><label>기사 아이디 (영문 소문자, 숫자)</label><input id="riderId" placeholder="rider001"><label>기사 이름</label><input id="riderName" placeholder="홍길동"><label>초기 비밀번호 (8자 이상)</label><input id="riderPassword" type="password" autocomplete="new-password"><button id="create">기사 계정 발급</button><p class="muted">초기 비밀번호는 관리자와 기사만 공유하세요. 사이트에는 저장되지 않습니다.</p><h2>등록된 기사</h2><button class="secondary" id="reload">목록 새로고침</button><div id="list"></div><button id="logout" class="secondary">로그아웃</button></section><p id="msg" role="status" aria-live="polite"></p></div></main><script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
